<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto BYD Dolphin GS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-12">
    <div class="max-w-md mx-auto bg-gray-100 min-h-screen">
        
        <!-- CABEÇALHO COM LOGO BYD -->
        <div class="bg-white p-4 text-center shadow-sm border-b border-gray-200 flex justify-center items-center gap-3 sticky top-0 z-10">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/f4/BYD_logo.svg" alt="BYD" class="h-5">
            <div class="h-6 w-px bg-gray-300"></div>
            <h1 class="text-lg font-bold text-gray-700 tracking-wide">Painel Dolphin</h1>
        </div>

        <!-- CARTÃO DE RESUMO DE ECONOMIA -->
        <div class="m-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
            <div class="mb-4">
                <p class="text-sm text-gray-500 mb-1">Gasto total com Dolphin Mini</p>
                <p class="text-2xl font-bold text-gray-800">R$ <span id="valGastoEV">0,00</span></p>
            </div>
            
            <div class="mb-4">
                <p class="text-sm text-gray-500 mb-1">Gasto equivalente em gasolina</p>
                <p class="text-2xl font-bold text-gray-800">R$ <span id="valGastoGas">0,00</span></p>
            </div>
            
            <div class="pt-4 border-t border-gray-100 flex justify-between items-center">
                <p class="text-base font-semibold text-gray-700">Economia real</p>
                <p class="text-2xl font-bold text-emerald-600">R$ <span id="valEconomia">0,00</span></p>
            </div>

            <!-- Amortização -->
            <div class="mt-5 bg-gray-50 p-3 rounded-xl border border-gray-100">
                <div class="flex justify-between text-xs text-gray-500 mb-1">
                    <span>Amortização (Meta: R$ 119.990)</span>
                    <span id="pctAmortizacao" class="font-bold">0.00%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div id="barraProgresso" class="bg-emerald-500 h-2 rounded-full" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- MÓDULO 1: RECARGA -->
        <div class="m-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="font-bold text-gray-700 mb-4 flex items-center">🔌 1. Registrar Recarga</h2>
            
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Injetado (kWh)</label>
                    <input type="number" id="injetado" oninput="simularRecarga()" class="w-full p-2.5 border border-gray-300 rounded-lg bg-gray-50 text-lg font-semibold" placeholder="Ex: 15">
                </div>
                <div>
                    <label class="block text-xs text-gray-500
